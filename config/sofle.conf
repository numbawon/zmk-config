# Sofle v2.1 + nice!nano v2, wireless (no TRRS)

# OLED displays
CONFIG_ZMK_DISPLAY=y

# Rotary encoders (both halves)
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB (per-key + underglow, 36 LEDs per half)
CONFIG_ZMK_RGB_UNDERGLOW=y
# Start dim to save battery; adjust with RGB_BRI/RGB_BRD on ADJUST layer
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=30
# Turn LEDs off when keyboard goes idle
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
